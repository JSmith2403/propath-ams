<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── PWA / install ─────────────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.json" id="pwa-manifest" />
    <!--
      Android/Chrome re-evaluates install eligibility dynamically (the
      "Install" banner in InstallPrompt.jsx waits 10s before showing,
      which is ample time), so swapping the manifest <link> here still
      reliably gives Android the per-token start_url. iOS does NOT
      behave this way — see the static apple-mobile-web-app-capable="no"
      below instead, which is the actual fix for iOS.
    -->
    <script>
      (function () {
        try {
          var link = document.getElementById('pwa-manifest');
          if (!link) return;
          if (location.pathname === '/athlete') {
            // Stable PIN-login entry point — same manifest for every
            // athlete, start_url=/athlete. Static file, no per-token
            // endpoint needed since there's nothing athlete-specific
            // about this URL.
            link.setAttribute('href', '/manifest-athlete.json');
            return;
          }
          var m = location.pathname.match(/^\/athlete\/([A-Za-z0-9_-]+)/);
          if (!m) return;
          var token = m[1];
          link.setAttribute('href', '/api/manifest/' + encodeURIComponent(token));
        } catch (e) { /* keep defaults on failure */ }
      })();
    </script>
    <meta name="theme-color" content="#1C1C1C" />

    <!-- iOS home-screen icons -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152.png" />
    <!--
      Static "no" (not toggled by JS — see the script above). iOS reads
      this tag from the raw HTML at parse time, before any script runs,
      so a client-side mutation loses the race and iOS locks in "yes"
      regardless. Coach pages don't need a fullscreen iOS install
      either, so there's no real trade-off to statically opting out.
    -->
    <meta name="apple-mobile-web-app-capable" content="no" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ProPath" />

    <!-- Browser favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />

    <!-- Pre-paint the dark background so launch from home-screen has no
         white flash before React mounts. -->
    <style>
      html, body, #root { background-color: #1C1C1C; }
      body {
        margin: 0;
        /* Respect notches / home-indicators in standalone mode. */
        padding-top:    env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left:   env(safe-area-inset-left);
        padding-right:  env(safe-area-inset-right);
      }
    </style>

    <title>ProPath AMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
