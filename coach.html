<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      Coach / admin shell — served for everything that isn't an athlete or parent
      page (see vercel.json). iOS reads <meta apple-mobile-web-app-capable> from
      the raw HTML before any script runs, so it has to be static. "yes" here makes
      the coach app install as a real full-screen app on iPhone, which is also what
      lets iOS deliver push notifications (athlete replies) to it.

      The legacy per-athlete /athlete/<token> links and wellness links still use
      index.html, which keeps "no" — nothing about them changes.
    -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1C1C1C" />

    <!-- iOS home-screen icons -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ProPath" />

    <!-- Browser favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />

    <!-- Pre-paint the dark background so launch from home-screen has no
         white flash before React mounts. -->
    <style>
      html, body, #root { background-color: #1C1C1C; }
      body {
        margin: 0;
        /* Respect notches / home-indicators in standalone mode. */
        padding-top:    env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left:   env(safe-area-inset-left);
        padding-right:  env(safe-area-inset-right);
      }
    </style>

    <title>ProPath AMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
