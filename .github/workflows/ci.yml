name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # ponytail: `npm install` (not `npm ci`) — the lockfile trips npm 10.9's
      # strict validator on Linux for a reason we can't see without auth. CI
      # never pushes, so any lockfile regen it does is harmless.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Dummy values — the build only needs the vars to exist.
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
